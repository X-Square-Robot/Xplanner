name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - "index.html"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "build_type=$pages_build_type" >> "$GITHUB_OUTPUT"
          if [ "$pages_build_type" = "legacy" ]; then
            echo "GitHub's built-in Pages deployment publishes main:/ using index.html."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        if: steps.pages.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
