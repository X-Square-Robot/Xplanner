version: memory_v3

# Copy this file to a local working directory and replace these paths.
input_snapshot: /path/to/discovery_snapshot
output_root: work_dirs/context_data

anchor_stride_frames: 20
history_offsets_frames: [-20, -10, 0]
known_source_fps: {}

short_memory_k: 1
visible_long_memory_limit: 8
terminal_caption: the task is complete
terminal_prediction_progress_percent: 0

resize:
  policy_id: auto_near_640_no_upscale_v1
  mode: auto_near_640
  target_long_edge: 640
  factor: 32
  preserve_aspect_ratio: true
  never_exceed_original: true
  pixel_cap: 589824

initial_plan:
  max_context_tokens: 4096
  fallback_chars_per_token: 3.0
  image_tokens_per_image: 400
  safety_margin_tokens: 256

train_mix:
  continuous: 0.70
  initial_plan: 0.15
  terminal: 0.15

runtime:
  num_shards: 256
  workers: 16
  checkpoint_episodes: 25
