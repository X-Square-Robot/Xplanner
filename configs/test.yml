# ============================================================
# 示例数据配置：Qwen3.5-VL 混合多模态 VQA（图像 + 视频）
#
# 一个 multimodal_jsonl vision 处理器同时读 `image` / `video` 字段，图像与视频 VQA
# 共用一条路由。坐标已是 [0,1000) 归一化（Qwen3.5 约定），原样透传。
#
# 数据是索引化的 multimodal_jsonl 布局（data.jsonl + data.index + manifest.json），
# 由 scripts/convert_data_list.py 从 ShareGPT JSONL 转出。下面 sources 里的 path 换成你自己的。
#
# 用法：dataset, sampler = X2RobotDataset.from_config('configs/vqa_mix_qwen3_5.yml')
# 相对路径（length_cache / cache_vqa / report_path）相对训练启动目录（本仓库根）。
# ============================================================

dataset:
  train_test_split: 1.0
  multimodal_chunk_size: 200

  # 解码期坏样本容忍：处理时报错的样本从其 batch 里丢掉（记到 report_path），而不是让训练崩。
  # 与长度预估器"上游丢弃元数据可检测的损坏"互补。
  bad_sample_tolerance:
    enabled: true
    report_path: ./bad_samples_runtime.jsonl
    # include_traceback: true       # 默认
    # max_traceback_chars: 8000     # 默认

  sampler:
    length_cache_dir: /mnt/cpfs/zbl-cpfs-new/open_data/Multi-Modal-dataset/TRAINSET/packing_data/qwen35/dataset_v2/test
    seed: 42
    # knapsack_packed: 按 token 预算把多条 doc 装进一行（整行 Σtokens ≤ cutoff），每行尽量
    # 填满 → 每步 token 数均匀。一个 bin=一行=一步，trainer 走 batch_sampler；
    # 启动脚本 --per_device_train_batch_size 必须=1。
    type: knapsack_packed
    cutoff: 8192             # 每行 token 预算；应与 epilogue.max_seq_length 一致
    # pad_to_cutoff: false   # 默认不 pad
    #
    # 各 source 大小悬殊时，可按 frames 重新平衡：
    # task_balance: { type: power_law, params: { alpha: 0.3 }, unit: frames }

  pipeline: [vision, text, metadata]
  cache: { enabled: true, dir: ./cache_vqa, rebuild: false }

  processors:
    vision:
      type: multimodal_jsonl
      params:
        # 图像分支：保持长宽比的面积预算 min_pixels=32^2 / max_pixels=768^2；
        # image_factor=32 让 grid 落在 patch_size*spatial_merge_size = 16*2 上。
        image_factor: 32
        min_pixels: 1024
        max_pixels: 589824
        # 视频分支（forced-sequential decode）
        video_fps: 2
        video_maxlen: 64
        video_max_pixels: 147456     # 384 * 384
        # video_max_pixels: 36864    # 192 * 192
        video_min_pixels: 256        # 16 * 16
        decoder_backend: av
    text:   { type: multimodal_jsonl_qwen3_5 }
    epilogue:
      type: multimodal_qwen3_5
      params:
        processor_path: /mnt/cpfs/zbl-cpfs-new/Models/Qwen3.5-9B   # 换成你的模型路径
        max_seq_length: 8192
        padding_side: right
        packing: true

  sources:
    # ---- 图像 sources（dataset_v2）----
    - name: ca1m_choice
      source_type: multimodal
      paths:
        - { path: /mnt/cpfs/zbl-cpfs-new/open_data/Multi-Modal-dataset/TRAINSET/dataset_v2/ca1m_choice, episode_type: x2_multimodal, task_name: ca1m_choice }
    - name: ca1m_multi_view
      source_type: multimodal
      paths:
        - { path: /mnt/cpfs/zbl-cpfs-new/open_data/Multi-Modal-dataset/TRAINSET/dataset_v2/ca1m_multi_view, episode_type: x2_multimodal, task_name: ca1m_multi_view }
    - name: ca1m_vacant
      source_type: multimodal
      paths:
        - { path: /mnt/cpfs/zbl-cpfs-new/open_data/Multi-Modal-dataset/TRAINSET/dataset_v2/ca1m_vacant, episode_type: x2_multimodal, task_name: ca1m_vacant }
    - name: ca1m_visual_choice
      source_type: multimodal
      paths:
        - { path: /mnt/cpfs/zbl-cpfs-new/open_data/Multi-Modal-dataset/TRAINSET/dataset_v2/ca1m_visual_choice, episode_type: x2_multimodal, task_name: ca1m_visual_choice }
