# ============================================================
# 示例数据配置：Qwen3.5-VL 混合多模态 VQA（图像 + 视频）
#
# 一个 multimodal_jsonl vision 处理器同时读 `image` / `video` 字段，图像与视频 VQA
# 共用一条路由。坐标已是 [0,1000) 归一化（Qwen3.5 约定），原样透传。
#
# 数据是索引化的 multimodal_jsonl 布局（data.jsonl + data.index + manifest.json），
# 由 scripts/convert_data_list.py 从 ShareGPT JSONL 转出。下面 sources 里的 path 换成你自己的。
#
# 用法：dataset, sampler = X2RobotDataset.from_config('configs/vqa_mix_qwen3_5.yml')
# 相对路径（length_cache / cache_vqa / report_path）相对训练启动目录（本仓库根）。
# ============================================================

dataset:
  train_test_split: 1.0
  multimodal_chunk_size: 200

  # 解码期坏样本容忍：处理时报错的样本从其 batch 里丢掉（记到 report_path），而不是让训练崩。
  # 与长度预估器"上游丢弃元数据可检测的损坏"互补。
  bad_sample_tolerance:
    enabled: true
    report_path: ./bad_samples_runtime.jsonl
    # include_traceback: true       # 默认
    # max_traceback_chars: 8000     # 默认

  sampler:
    length_cache_dir: ./length_cache
    seed: 42
    # knapsack_packed: 按 token 预算把多条 doc 装进一行（整行 Σtokens ≤ cutoff），每行尽量
    # 填满 → 每步 token 数均匀。一个 bin=一行=一步，trainer 走 batch_sampler；
    # 启动脚本 --per_device_train_batch_size 必须=1。
    type: knapsack_packed
    cutoff: 8192             # 每行 token 预算；应与 epilogue.max_seq_length 一致
    # pad_to_cutoff: false   # 默认不 pad
    #
    # 各 source 大小悬殊时，可按 frames 重新平衡：
    # task_balance: { type: power_law, params: { alpha: 0.3 }, unit: frames }

  pipeline: [vision, text, metadata]
  cache: { enabled: true, dir: ./cache_vqa, rebuild: false }

  processors:
    vision:
      type: multimodal_jsonl
      params:
        # 图像分支：保持长宽比的面积预算 min_pixels=32^2 / max_pixels=768^2；
        # image_factor=32 让 grid 落在 patch_size*spatial_merge_size = 16*2 上。
        image_factor: 32
        min_pixels: 1024
        max_pixels: 589824
        # 视频分支（forced-sequential decode）
        video_fps: 1
        video_maxlen: 32
        video_max_pixels: 147456     # 384 * 384
        # video_max_pixels: 36864    # 192 * 192
        video_min_pixels: 256        # 16 * 16
        decoder_backend: av
    text:   { type: multimodal_jsonl_qwen3_5 }
    epilogue:
      type: multimodal_qwen3_5
      params:
        processor_path: /mnt/data/x2robot_v2/Models/Qwen3.5-9B   # 换成你的模型路径
        max_seq_length: 8192
        padding_side: right
        packing: true

  sources:
    # ---- 图像 sources（path 换成你自己的）----
    - name: roboafford_embodied_r15
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/roboafford_embodied_r15, episode_type: x2_multimodal, task_name: roboafford_embodied_r15 }
    - name: robo2vlm
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/robo2vlm, episode_type: x2_multimodal, task_name: robo2vlm }
    - name: robointer_vqa_qwen3_grounding_choice
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/robointer_vqa_qwen3_grounding_choice, episode_type: x2_multimodal, task_name: robointer_vqa_qwen3_grounding_choice }
    - name: eo_qwen3_next_action
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/eo_qwen3_next_action, episode_type: x2_multimodal, task_name: eo_qwen3_next_action }
    - name: fsd_0_1000
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/fsd_0_1000, episode_type: x2_multimodal, task_name: fsd_0_1000 }
    - name: robopoint_0_1000
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/robopoint_0_1000, episode_type: x2_multimodal, task_name: robopoint_0_1000 }
    - name: eriq
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/eriq, episode_type: x2_multimodal, task_name: eriq }
    - name: vsi590k_image
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/vsi590k_image, episode_type: x2_multimodal, task_name: vsi590k_image }
    - name: clevr
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/clevr, episode_type: x2_multimodal, task_name: clevr }
    - name: eo_data_public
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/eo_data_public, episode_type: x2_multimodal, task_name: eo_data_public }
    - name: robointer_vqa_public
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/robointer_vqa_public, episode_type: x2_multimodal, task_name: robointer_vqa_public }
    - name: sensenova_si_public
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/sensenova_si_public, episode_type: x2_multimodal, task_name: sensenova_si_public }
    - name: refspatial_public
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/refspatial_public, episode_type: x2_multimodal, task_name: refspatial_public }
    - name: robofac
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/robofac, episode_type: x2_multimodal, task_name: robofac }
    - name: interndata_m1
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/interndata_m1, episode_type: x2_multimodal, task_name: interndata_m1 }
    - name: robovqa_train
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/robovqa_train, episode_type: x2_multimodal, task_name: robovqa_train }
    - name: embspatial_sft
      source_type: multimodal
      paths:
        - { path: /mnt/data/x2robot_v2/cyril/multimodal_datasets_v3/embspatial_sft, episode_type: x2_multimodal, task_name: embspatial_sft }
    # ---- 视频 sources（建议先做 GOP-30 转码，见 docs/qwenvl/gop30_video_transcode.md）----
    - name: vlm3r
      source_type: multimodal
      paths:
        - { path: /mnt/cpfs/zbl-cpfs-new/open_data/cyril/vqa_gop30/sources/vlm3r, episode_type: x2_multimodal, task_name: vlm3r }
    - name: vsi590k_video
      source_type: multimodal
      paths:
        - { path: /mnt/cpfs/zbl-cpfs-new/open_data/cyril/vqa_gop30/sources/vsi590k_video, episode_type: x2_multimodal, task_name: vsi590k_video }

    # ---- 示例：带 per-source 处理器覆盖的 source（此处为机器人任务完成度 value）----
