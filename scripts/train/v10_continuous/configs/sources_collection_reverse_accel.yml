version: 1
sources:
  # The primary scanner walks the collection root in filesystem order.  This
  # independent accelerator walks the still-unseen top-level roots in reverse
  # order, while retaining episode keys relative to the canonical collection
  # root so catalogs can be merged with exact de-duplication.
  - name: collection
    kind: collection_partition
    episode_key_root: /mnt/cpfs/zbl-cpfs-new/x2robot_data/collection
    roots:
