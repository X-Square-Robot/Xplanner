[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-planner"
version = "0.1.0.dev0"
description = "Vision-language planning data, training, inference, and evaluation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.urls]
Homepage = "https://x-square-robot.github.io/Xplanner/"
Repository = "https://github.com/X-Square-Robot/Xplanner"
Documentation = "https://x-square-robot.github.io/Xplanner/"
Paper = "https://github.com/X-Square-Robot/Xplanner/blob/main/docs/paper/X_Planner_Event_Structured_Task_Planning_for_Embodied_Intelligence.pdf"
Model = "https://huggingface.co/x-square-robot/X-Planner-9B-0916"
Benchmark = "https://huggingface.co/datasets/x-square-robot/xplanner-benchmark"

[project.optional-dependencies]
train = [
  "accelerate>=1.1",
  "deepspeed>=0.17",
  "torch>=2.6",
  "transformers>=5.2",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["x_planner*"]

[tool.setuptools.package-data]
"x_planner.data.pipeline" = ["configs/*.yml"]
"x_planner.data.discovery" = ["configs/*.yml"]
"x_planner.data.context" = ["configs/*.yaml"]
"x_planner.evaluation.rollout" = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
