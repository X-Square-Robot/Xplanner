[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-planner"
version = "0.1.0.dev0"
description = "X-Planner: Event-Structured Task Planning for Embodied Intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.1",
  "deepspeed>=0.17",
  "torch>=2.6",
  "transformers>=5.2",
]

[tool.setuptools.packages.find]
include = ["x_planner*"]

[tool.setuptools.package-data]
"x_planner.data.pipeline" = ["configs/*.yml"]
"x_planner.data.discovery" = ["configs/*.yml"]
"x_planner.data.context" = ["configs/*.yaml"]
"x_planner.evaluation.rollout" = ["configs/*.yaml"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
